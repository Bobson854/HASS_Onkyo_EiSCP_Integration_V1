[project]
name = "pioneer-eiscp-ha-dev"
version = "0.0.0"
description = "Local development and test tooling for the Pioneer eISCP Home Assistant integration (not installable via pip)."
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

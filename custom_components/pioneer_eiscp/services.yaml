send_raw:
  name: Send raw ISCP command
  description: Send a low-level ISCP command body to the receiver (engineering/testing).
  target:
  fields:
    iscp_command:
      name: ISCP command
      description: Raw ISCP body, e.g. IFAQSTN, LMDQSTN, MVL14.
      required: true
      example: IFAQSTN
      selector:
        text:
    config_entry:
      name: Receiver
      description: Pioneer eISCP config entry when multiple AVRs are configured.
      required: false
      selector:
        config_entry:
          integration: pioneer_eiscp

probe_capabilities:
  name: Probe receiver capabilities
  description: Run read-only eISCP queries and store results in diagnostics.
  target:
  fields:
    config_entry:
      name: Receiver
      description: Pioneer eISCP config entry when multiple AVRs are configured.
      required: false
      selector:
        config_entry:
          integration: pioneer_eiscp
